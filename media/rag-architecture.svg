<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title description">
  <title id="title">Chemin d'une requête RAG</title>
  <desc id="description">Une question traverse l'API du site, l'embedding, la recherche ChromaDB, les chunks, la construction du prompt et un modèle via une API externe avant le retour progressif de la réponse.</desc>
  <style>
    .text { font-family: system-ui, sans-serif; }
    .number { fill: #1d5fa8; font-size: 16px; font-weight: 700; }
    .label { fill: #171b20; font-size: 23px; font-weight: 650; }
    .note { fill: #626970; font-size: 17px; }
    .stage { fill: #faf8f2; stroke: #c8c4ba; stroke-width: 1.5; }
    .line { fill: none; stroke: #1d5fa8; stroke-width: 2; }
    .icon { fill: none; stroke: #777f87; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 600px) {
      .number { font-size: 23px; }
      .label { font-size: 29px; }
      .note { font-size: 24px; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4" fill="none" stroke="#1d5fa8" stroke-width="1.5"/>
    </marker>
  </defs>
  <g class="text" transform="translate(20 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">01</text>
    <text class="label" x="85" y="72" text-anchor="middle"><tspan x="85">Question</tspan><tspan x="85" dy="28">utilisateur</tspan></text>
    <g class="icon">
      <rect x="38" y="137" width="94" height="62" rx="2"/>
      <path d="M62 171h46M48 216h74"/>
      <path d="M116 198l16 17v-24"/>
    </g>
  </g>

  <g class="text" transform="translate(215 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">02</text>
    <text class="label" x="85" y="86" text-anchor="middle">API du site</text>
    <g class="icon">
      <rect x="42" y="135" width="86" height="24" rx="2"/>
      <rect x="42" y="174" width="86" height="24" rx="2"/>
      <circle cx="112" cy="147" r="3" fill="#1d5fa8" stroke="none"/>
      <circle cx="112" cy="186" r="3" fill="#1d5fa8" stroke="none"/>
    </g>
  </g>

  <g class="text" transform="translate(410 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">03</text>
    <text class="label" x="85" y="86" text-anchor="middle">Embedding</text>
    <g class="icon">
      <path d="M53 134H38v78h15M117 134h15v78h-15"/>
      <circle cx="68" cy="154" r="4" fill="#1d5fa8" stroke="none"/>
      <circle cx="86" cy="173" r="4" fill="#1d5fa8" stroke="none"/>
      <circle cx="104" cy="192" r="4" fill="#1d5fa8" stroke="none"/>
    </g>
  </g>

  <g class="text" transform="translate(605 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">04</text>
    <text class="label" x="85" y="86" text-anchor="middle">ChromaDB</text>
    <g class="icon">
      <ellipse cx="85" cy="145" rx="47" ry="15"/>
      <path d="M38 145v63c0 9 21 16 47 16s47-7 47-16v-63"/>
      <path d="M38 176c0 9 21 16 47 16s47-7 47-16"/>
    </g>
  </g>

  <g class="text" transform="translate(800 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">05</text>
    <text class="label" x="85" y="86" text-anchor="middle">Chunks</text>
    <g class="icon">
      <rect x="38" y="132" width="94" height="31" rx="2"/>
      <rect x="38" y="174" width="94" height="31" rx="2"/>
      <rect x="38" y="216" width="70" height="20" rx="2" opacity=".65"/>
      <path d="M54 148h56M54 190h44"/>
    </g>
  </g>

  <g class="text" transform="translate(995 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">06</text>
    <text class="label" x="85" y="86" text-anchor="middle">Prompt</text>
    <g class="icon">
      <rect x="37" y="130" width="96" height="106" rx="2"/>
      <path d="M54 153h61M54 176h46M54 199h61M54 222h34"/>
      <path d="M50 187h70" stroke="#1d5fa8"/>
    </g>
  </g>

  <g class="text" transform="translate(1190 90)">
    <rect class="stage" width="170" height="270" rx="2"/>
    <text class="number" x="18" y="30">07</text>
    <text class="label" x="85" y="72" text-anchor="middle"><tspan x="85">LLM</tspan><tspan x="85" dy="28">API externe</tspan></text>
    <g class="icon">
      <circle cx="85" cy="174" r="44"/>
      <path d="M64 174h42M85 153v42M70 159l30 30M100 159l-30 30"/>
    </g>
  </g>

  <g class="line" marker-end="url(#arrow)">
    <path d="M194 225h16"/><path d="M389 225h16"/><path d="M584 225h16"/>
    <path d="M779 225h16"/><path d="M974 225h16"/><path d="M1169 225h16"/>
  </g>

  <g class="text">
    <rect class="stage" x="420" y="490" width="560" height="130" rx="2"/>
    <text class="number" x="446" y="526">08</text>
    <text class="label" x="486" y="526">Réponse générée</text>
    <g class="icon"><path d="M446 553h440M446 576h376M446 599h298"/></g>
    <text class="note" x="1080" y="539" text-anchor="middle">streaming</text>
  </g>
  <path class="line" d="M1275 365v190H995" marker-end="url(#arrow)"/>
</svg>
