<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">RAG corpus indexing</title>
  <desc id="description">Markdown documents are split into chunks, converted into embeddings and stored in ChromaDB running with Docker on a Linux VPS.</desc>
